# FFmpeg switches for libVLC lite (task 22), added after VLC's own; one per line.
# The TV decodes most video itself (MediaCodec); FFmpeg is the fallback for what
# it cannot: software video, the sound the TV lacks, subtitles in pictures.
--disable-everything
--disable-libgsm
--disable-libopenjpeg
# video
--enable-decoder=h264,hevc,mpeg1video,mpeg2video,mpeg4,h263,msmpeg4v1,msmpeg4v2,msmpeg4v3,vc1,wmv1,wmv2,wmv3,vp8,vp9,mjpeg,flv,vp6f
# sound
--enable-decoder=aac,aac_latm,ac3,eac3,dca,truehd,mlp,mp1,mp1float,mp2,mp2float,mp3,mp3float,opus,vorbis,flac,alac,wmav1,wmav2,wmapro,adpcm_swf,nellymoser
# subtitles drawn as pictures (Blu-ray, DVD, DVB)
--enable-decoder=pgssub,dvdsub,dvbsub
--enable-parser=h264,hevc,mpeg4video,mpegvideo,vc1,vp8,vp9,aac,aac_latm,ac3,dca,mlp,mpegaudio,opus,vorbis,flac,dvbsub,dvdsub
# containers VLC has no demuxer of its own for (FLV), and a fallback for the rest
--enable-demuxer=flv,live_flv,mov,matroska,avi,mpegts,mpegps,aac,ac3,eac3,dts,mp3,wav,ogg,flac
# RTMP through FFmpeg
--enable-protocol=rtmp,rtmpt,tcp
